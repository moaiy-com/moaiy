disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name
  - large_tuple
  - for_where
  - implicit_optional_initialization
  - opening_brace
  - comma
  - colon
  - vertical_whitespace
  - todo
  - nesting
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - empty_enum_arguments
  - redundant_string_enum_value
  - syntactic_sugar
  - unused_closure_parameter
  - optional_data_string_conversion
  - non_optional_string_data_conversion
  - orphaned_doc_comment
  - mark
  - control_statement
  - void_function_in_ternary
  - statement_position
  - empty_count
  - empty_parentheses_with_trailing_closure
  - shorthand_operator
  - unneeded_break_in_switch

type_name:
  excluded:
    - UI

included:
  - Moaiy/Services/GPGService.swift
  - Moaiy/Services/GPGError.swift
  - Moaiy/Services/StreamingCryptoPipeline.swift
  - Moaiy/Services/KeychainService.swift
  - Moaiy/Services/SecureMemory.swift
  - Moaiy/Services/TransientFileRegistry.swift
  - Moaiy/Utils/Constants.swift
  - MoaiyCLI/main.swift

excluded:
  - Moaiy/build
  - .build
  - scripts
  - MoaiySandboxTest
